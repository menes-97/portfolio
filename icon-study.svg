<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Book left page -->
  <path d="M80 140 Q80 120 100 120 L248 120 L248 390 L100 390 Q80 390 80 370 Z" fill="#4c1d95" opacity="0.9"/>
  <!-- Book right page -->
  <path d="M432 140 Q432 120 412 120 L264 120 L264 390 L412 390 Q432 390 432 370 Z" fill="url(#book)"/>
  <!-- Spine -->
  <rect x="244" y="110" width="24" height="290" rx="4" fill="#6d28d9"/>
  <!-- Left page lines -->
  <rect x="108" y="170" width="112" height="10" rx="5" fill="#7c3aed" opacity="0.5"/>
  <rect x="108" y="198" width="90" height="10" rx="5" fill="#7c3aed" opacity="0.4"/>
  <rect x="108" y="226" width="112" height="10" rx="5" fill="#7c3aed" opacity="0.5"/>
  <rect x="108" y="254" width="70" height="10" rx="5" fill="#7c3aed" opacity="0.4"/>
  <rect x="108" y="282" width="100" height="10" rx="5" fill="#7c3aed" opacity="0.5"/>
  <rect x="108" y="310" width="112" height="10" rx="5" fill="#7c3aed" opacity="0.4"/>
  <!-- Right page lines -->
  <rect x="292" y="170" width="112" height="10" rx="5" fill="white" opacity="0.25"/>
  <rect x="292" y="198" width="80" height="10" rx="5" fill="white" opacity="0.2"/>
  <rect x="292" y="226" width="112" height="10" rx="5" fill="white" opacity="0.25"/>
  <rect x="292" y="254" width="96" height="10" rx="5" fill="white" opacity="0.2"/>
  <rect x="292" y="282" width="112" height="10" rx="5" fill="white" opacity="0.25"/>
  <rect x="292" y="310" width="64" height="10" rx="5" fill="white" opacity="0.2"/>
  <!-- Star top right -->
  <g filter="url(#glow)" transform="translate(356, 68)">
    <polygon points="36,0 44,26 72,26 50,42 58,68 36,52 14,68 22,42 0,26 28,26" fill="#f59e0b" transform="scale(0.72)"/>
  </g>
  <!-- Bookmark -->
  <polygon points="380,112 380,190 360,174 340,190 340,112" fill="#c4b5fd" opacity="0.8"/>
  <!-- Book shine -->
  <path d="M264 120 L432 140 L432 150 L264 130 Z" fill="white" opacity="0.06"/>
</svg>
