<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c17"/>
      <stop offset="100%" stop-color="#011a0e"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Prayer mat -->
  <rect x="60" y="400" width="392" height="52" rx="16" fill="#064e30" stroke="#10b981" stroke-width="3" opacity="0.8"/>
  <rect x="80" y="420" width="352" height="4" rx="2" fill="#10b981" opacity="0.3"/>
  <!-- Stars -->
  <circle cx="420" cy="90" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="380" cy="60" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="450" cy="140" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="90" cy="80" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="130" cy="110" r="2.5" fill="#f59e0b" opacity="0.5"/>
  <!-- Figure in Sujud (prostration) - simplified silhouette -->
  <g filter="url(#glow)" stroke="url(#fig)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head on ground -->
    <circle cx="148" cy="370" r="28" fill="#10b981" stroke="none" opacity="0.9"/>
    <!-- Body going up-back -->
    <line x1="172" y1="358" x2="290" y2="298" stroke-width="28"/>
    <!-- Arms on ground -->
    <line x1="168" y1="368" x2="88" y2="375" stroke-width="20"/>
    <line x1="168" y1="362" x2="230" y2="368" stroke-width="20"/>
    <!-- Kneeling legs -->
    <line x1="290" y1="298" x2="268" y2="388" stroke-width="24"/>
    <line x1="290" y1="298" x2="320" y2="390" stroke-width="22"/>
    <!-- Feet -->
    <line x1="268" y1="388" x2="300" y2="396" stroke-width="16"/>
    <line x1="320" y1="390" x2="350" y2="398" stroke-width="16"/>
  </g>
  <!-- Arabic star symbol top center -->
  <text x="256" y="100" text-anchor="middle" font-family="serif" font-size="72" fill="#f59e0b" opacity="0.9">&#10024;</text>
</svg>
