<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1a0510"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Stem top -->
  <rect x="220" y="68" width="72" height="28" rx="14" fill="#f43f5e"/>
  <!-- Clock outer ring -->
  <circle cx="256" cy="290" r="170" fill="#2d0a14" stroke="#f43f5e" stroke-width="4" opacity="0.6"/>
  <!-- Progress arc (approx 3/4 of circle) -->
  <circle cx="256" cy="290" r="150" fill="none" stroke="#1f0a10" stroke-width="36"/>
  <circle cx="256" cy="290" r="150" fill="none" stroke="url(#ring)" stroke-width="36"
    stroke-dasharray="707 942" stroke-dashoffset="235"
    stroke-linecap="round"
    transform="rotate(-90 256 290)" filter="url(#glow)"/>
  <!-- Clock face -->
  <circle cx="256" cy="290" r="112" fill="#1a0510"/>
  <!-- Hour markers -->
  <rect x="250" y="158" width="12" height="24" rx="6" fill="#f43f5e" opacity="0.5"/>
  <rect x="250" y="374" width="12" height="24" rx="6" fill="#f43f5e" opacity="0.5"/>
  <rect x="120" y="284" width="24" height="12" rx="6" fill="#f43f5e" opacity="0.5"/>
  <rect x="368" y="284" width="24" height="12" rx="6" fill="#f43f5e" opacity="0.5"/>
  <!-- Hour hand -->
  <line x1="256" y1="290" x2="256" y2="196" stroke="#fda4af" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="290" x2="328" y2="258" stroke="#f43f5e" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="290" r="14" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="256" cy="290" r="7" fill="white" opacity="0.8"/>
</svg>
