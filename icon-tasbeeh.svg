<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0a40"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="bead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bead2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- String circle -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#4c1d95" stroke-width="5" opacity="0.6"/>
  <!-- Prayer beads (11 around circle + 1 large at bottom) -->
  <!-- Bead positions on circle r=162, centered at 256,256 -->
  <!-- 0°: top -->
  <g filter="url(#glow)">
    <circle cx="256" cy="94" r="20" fill="url(#bead)"/>
    <!-- 30° -->
    <circle cx="337" cy="113" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 60° -->
    <circle cx="396" cy="175" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 90°: right -->
    <circle cx="418" cy="256" r="20" fill="url(#bead)"/>
    <!-- 120° -->
    <circle cx="396" cy="337" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 150° -->
    <circle cx="337" cy="396" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 180°: bottom - special separator -->
    <circle cx="256" cy="418" r="24" fill="url(#bead2)"/>
    <!-- 210° -->
    <circle cx="175" cy="396" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 240° -->
    <circle cx="116" cy="337" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 270°: left -->
    <circle cx="94" cy="256" r="20" fill="url(#bead)"/>
    <!-- 300° -->
    <circle cx="116" cy="175" r="17" fill="url(#bead)" opacity="0.85"/>
    <!-- 330° -->
    <circle cx="175" cy="113" r="17" fill="url(#bead)" opacity="0.85"/>
  </g>
  <!-- Shine on top bead -->
  <circle cx="249" cy="87" r="6" fill="white" opacity="0.4"/>
  <!-- Tassel/pendant at bottom -->
  <line x1="256" y1="442" x2="256" y2="478" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="484" r="10" fill="url(#bead2)"/>
  <!-- Center Arabic number 33 -->
  <text x="256" y="248" text-anchor="middle" font-family="'Georgia', serif" font-size="52" font-weight="bold" fill="#c4b5fd" opacity="0.9">33</text>
  <text x="256" y="292" text-anchor="middle" font-family="'Georgia', serif" font-size="26" fill="#a78bfa" opacity="0.7">Dhikr</text>
</svg>
