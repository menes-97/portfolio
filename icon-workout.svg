<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e30"/>
      <stop offset="100%" stop-color="#022c17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- Left weight block -->
    <rect x="52" y="188" width="88" height="136" rx="20" fill="url(#accent)"/>
    <!-- Left inner lines -->
    <rect x="72" y="208" width="48" height="8" rx="4" fill="#052e16" opacity="0.4"/>
    <rect x="72" y="228" width="48" height="8" rx="4" fill="#052e16" opacity="0.4"/>
    <rect x="72" y="296" width="48" height="8" rx="4" fill="#052e16" opacity="0.4"/>
    <rect x="72" y="296" width="48" height="8" rx="4" fill="#052e16" opacity="0.3"/>
    <!-- Left collar -->
    <rect x="140" y="224" width="52" height="64" rx="12" fill="#22c55e"/>
    <!-- Bar -->
    <rect x="192" y="244" width="128" height="24" rx="10" fill="#15803d"/>
    <!-- Center grip -->
    <rect x="232" y="238" width="48" height="36" rx="8" fill="#16a34a"/>
    <!-- Right collar -->
    <rect x="320" y="224" width="52" height="64" rx="12" fill="#22c55e"/>
    <!-- Right weight block -->
    <rect x="372" y="188" width="88" height="136" rx="20" fill="url(#accent)"/>
    <!-- Right inner lines -->
    <rect x="392" y="208" width="48" height="8" rx="4" fill="#052e16" opacity="0.4"/>
    <rect x="392" y="228" width="48" height="8" rx="4" fill="#052e16" opacity="0.4"/>
    <rect x="392" y="296" width="48" height="8" rx="4" fill="#052e16" opacity="0.3"/>
  </g>
  <!-- Shine overlay -->
  <rect x="52" y="188" width="88" height="40" rx="20" fill="white" opacity="0.07"/>
  <rect x="372" y="188" width="88" height="40" rx="20" fill="white" opacity="0.07"/>
</svg>
