<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTogether</title>
    <link rel="manifest" href="study-manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Study">
    <link rel="apple-touch-icon" href="favicon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #080810;
            --card: #10101a;
            --card2: #181825;
            --border: #252535;
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --purple-glow: rgba(139, 92, 246, 0.15);
            --blue: #3b82f6;
            --cyan: #06b6d4;
            --text: #e2e8f0;
            --muted: #64748b;
            --yellow: #fbbf24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        }

        /* Header */
        header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 8, 16, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            border-radius: 8px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .logo span { color: var(--purple); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .streak {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--yellow);
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 6px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Layout */
        .layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
        }

        .main-col { display: flex; flex-direction: column; gap: 1.5rem; }
        .side-col { display: flex; flex-direction: column; gap: 1.5rem; }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title-accent {
            width: 3px;
            height: 14px;
            background: var(--purple);
            border-radius: 2px;
        }

        /* Focus Timer (big) */
        .focus-card {
            background: linear-gradient(135deg, #10101a 0%, #14102a 100%);
            border-color: rgba(139, 92, 246, 0.2);
            text-align: center;
            padding: 2.5rem 2rem;
        }

        .focus-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--purple-glow);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 999px;
            padding: 0.35rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--purple);
            margin-bottom: 1.5rem;
        }

        .focus-timer-display {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text) 0%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .focus-timer-sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .focus-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-focus-main {
            padding: 0.875rem 3rem;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 25px var(--purple-glow);
            letter-spacing: 0.02em;
        }

        .btn-focus-main:hover { transform: translateY(-2px); box-shadow: 0 12px 35px var(--purple-glow); }

        .btn-focus-reset {
            padding: 0.875rem 1.25rem;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-focus-reset:hover { color: var(--text); border-color: var(--purple); }

        /* Duration presets */
        .presets {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .preset-btn {
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn.active, .preset-btn:hover {
            border-color: var(--purple);
            color: var(--purple);
            background: var(--purple-glow);
        }

        /* Today's sessions */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .session-block {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem;
            text-align: center;
            transition: all 0.2s;
        }

        .session-block.done {
            background: var(--purple-glow);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .session-block-time {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--purple);
        }

        .session-block-label {
            font-size: 0.65rem;
            color: var(--muted);
        }

        /* Subject tags */
        .subject-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .subject-pill {
            padding: 0.3rem 0.85rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .subject-pill.active {
            border-color: var(--purple);
            color: var(--purple);
            background: var(--purple-glow);
        }

        /* Notes */
        .notes-area {
            width: 100%;
            min-height: 140px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            resize: vertical;
            line-height: 1.7;
            transition: border-color 0.2s;
        }

        .notes-area:focus { outline: none; border-color: var(--purple); }

        /* To-Do */
        .todo-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .todo-input {
            flex: 1;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        .todo-input:focus { outline: none; border-color: var(--purple); }

        .btn-todo-add {
            background: var(--purple);
            border: none;
            border-radius: 10px;
            color: white;
            width: 38px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            transition: background 0.2s;
        }

        .btn-todo-add:hover { background: var(--purple-dark); }

        .todo-list { display: flex; flex-direction: column; gap: 0.4rem; }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.75rem;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 8px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .todo-check {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .todo-check.checked {
            background: var(--purple);
            border-color: var(--purple);
        }

        .todo-text {
            flex: 1;
            font-size: 0.85rem;
        }

        .todo-text.done {
            text-decoration: line-through;
            color: var(--muted);
        }

        .btn-todo-del {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.15rem;
            transition: color 0.2s;
        }

        .btn-todo-del:hover { color: #f43f5e; }

        /* Stats cards */
        .mini-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .mini-stat-card {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .mini-stat-val {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--purple);
        }

        .mini-stat-lbl {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.2rem;
        }

        /* Quote */
        .quote-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(59, 130, 246, 0.08));
            border-color: rgba(139, 92, 246, 0.2);
        }

        .quote-text {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: 0.5rem;
        }

        .quote-author {
            font-size: 0.8rem;
            color: var(--purple);
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .focus-timer-display { font-size: 4rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-badge">ST</div>
        Study<span>Together</span>
    </div>
    <div class="header-right">
        <div class="streak" id="streak-display">0 Tage</div>
        <div class="online-badge">
            <div class="online-dot"></div>
            <span id="online-count">1</span> Online
        </div>
    </div>
</header>

<div class="layout">
    <!-- Main Column -->
    <div class="main-col">

        <!-- Focus Timer -->
        <div class="card focus-card">
            <div style="margin-bottom: 1.25rem;">
                <div class="card-title" style="justify-content: center;"><div class="card-title-accent"></div> Fokus-Session</div>
            </div>
            <div class="focus-status" id="focus-status">
                <div style="width: 7px; height: 7px; border-radius: 50%; background: var(--purple);"></div>
                Bereit zum Lernen
            </div>
            <div class="focus-timer-display" id="focus-display">25:00</div>
            <div class="focus-timer-sub" id="focus-sub">Wahle eine Dauer und starte deine Session</div>

            <div class="focus-controls">
                <button class="btn-focus-main" id="btn-focus" onclick="toggleFocus()">Session starten</button>
                <button class="btn-focus-reset" onclick="resetFocus()">Zurucksetzen</button>
            </div>

            <div class="presets" id="presets">
                <button class="preset-btn active" onclick="setDuration(25, this)">25 Min</button>
                <button class="preset-btn" onclick="setDuration(45, this)">45 Min</button>
                <button class="preset-btn" onclick="setDuration(60, this)">60 Min</button>
                <button class="preset-btn" onclick="setDuration(90, this)">90 Min</button>
            </div>
        </div>

        <!-- Subject & Notes -->
        <div class="card">
            <div class="card-title"><div class="card-title-accent"></div> Fach & Notizen</div>
            <div class="subject-pills" id="subject-pills">
                <span class="subject-pill active" onclick="setSubject('Allgemein', this)">Allgemein</span>
                <span class="subject-pill" onclick="setSubject('Mathe', this)">Mathe</span>
                <span class="subject-pill" onclick="setSubject('Informatik', this)">Informatik</span>
                <span class="subject-pill" onclick="setSubject('Sprachen', this)">Sprachen</span>
                <span class="subject-pill" onclick="setSubject('Geschichte', this)">Geschichte</span>
                <span class="subject-pill" onclick="setSubject('Physik', this)">Physik</span>
            </div>
            <textarea class="notes-area" id="notes-area" placeholder="Schreib hier deine Notizen, Zusammenfassungen oder Gedanken..."></textarea>
            <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); text-align: right;" id="notes-saved"></div>
        </div>

        <!-- Stats -->
        <div class="card">
            <div class="card-title"><div class="card-title-accent"></div> Statistiken</div>
            <div class="mini-stats">
                <div class="mini-stat-card">
                    <div class="mini-stat-val" id="stat-sessions">0</div>
                    <div class="mini-stat-lbl">Sessions</div>
                </div>
                <div class="mini-stat-card">
                    <div class="mini-stat-val" id="stat-hours">0</div>
                    <div class="mini-stat-lbl">Stunden</div>
                </div>
                <div class="mini-stat-card">
                    <div class="mini-stat-val" id="stat-done">0</div>
                    <div class="mini-stat-lbl">Aufgaben erledigt</div>
                </div>
                <div class="mini-stat-card">
                    <div class="mini-stat-val" id="stat-streak">0</div>
                    <div class="mini-stat-lbl">Tage Streak</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Side Column -->
    <div class="side-col">

        <!-- To-Do -->
        <div class="card">
            <div class="card-title"><div class="card-title-accent"></div> Aufgaben</div>
            <div class="todo-input-row">
                <input class="todo-input" id="todo-input" placeholder="Neue Aufgabe..." />
                <button class="btn-todo-add" onclick="addTodo()">+</button>
            </div>
            <div class="todo-list" id="todo-list"></div>
        </div>

        <!-- Today Sessions -->
        <div class="card">
            <div class="card-title"><div class="card-title-accent"></div> Heutige Sessions</div>
            <div class="sessions-grid" id="sessions-grid"></div>
        </div>

        <!-- Motivational Quote -->
        <div class="card quote-card">
            <div class="card-title"><div class="card-title-accent"></div> Motivation</div>
            <div class="quote-text" id="quote-text"></div>
            <div class="quote-author" id="quote-author"></div>
        </div>

    </div>
</div>

<script>
    const QUOTES = [
        { text: "Bildung ist die kraftvollste Waffe, die du nutzen kannst, um die Welt zu verandern.", author: "Nelson Mandela" },
        { text: "Der einzige Weg, gute Arbeit zu leisten, ist zu lieben, was du tust.", author: "Steve Jobs" },
        { text: "Erfolg ist die Summe kleiner Buhungen, die jeden Tag wiederholt werden.", author: "Robert Collier" },
        { text: "Lerne, als ob du ewig leben wurdest. Lebe, als ob du morgen sterben wurdest.", author: "Mahatma Gandhi" },
        { text: "Der Anfang ist die Halfte des Ganzen.", author: "Aristoteles" },
        { text: "Wissen ist Macht.", author: "Francis Bacon" },
        { text: "Investiere in dein Wissen. Es zahlt die besten Zinsen.", author: "Benjamin Franklin" },
    ];

    let focusDuration = 25 * 60;
    let focusLeft = focusDuration;
    let focusRunning = false;
    let focusInterval = null;
    let currentSubject = 'Allgemein';
    let todos = JSON.parse(localStorage.getItem('st_todos') || '[]');
    let sessions = JSON.parse(localStorage.getItem('st_sessions') || '[]');
    let totalSessions = parseInt(localStorage.getItem('st_total_sessions') || '0');
    let totalMinutes = parseInt(localStorage.getItem('st_total_minutes') || '0');
    let streak = parseInt(localStorage.getItem('st_streak') || '0');

    function formatTime(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function setDuration(mins, el) {
        if (focusRunning) return;
        focusDuration = mins * 60;
        focusLeft = focusDuration;
        document.getElementById('focus-display').textContent = formatTime(focusLeft);
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function toggleFocus() {
        if (focusRunning) {
            pauseFocus();
        } else {
            startFocus();
        }
    }

    function startFocus() {
        focusRunning = true;
        document.getElementById('btn-focus').textContent = 'Pausieren';
        document.getElementById('focus-status').innerHTML = '<div style="width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 1s infinite;"></div> Fokus aktiv';
        document.getElementById('focus-sub').textContent = 'Konzentriere dich! Du schaffst das.';
        document.getElementById('presets').style.opacity = '0.4';
        document.getElementById('presets').style.pointerEvents = 'none';
        focusInterval = setInterval(() => {
            focusLeft--;
            document.getElementById('focus-display').textContent = formatTime(focusLeft);
            if (focusLeft <= 0) focusDone();
        }, 1000);
    }

    function pauseFocus() {
        focusRunning = false;
        clearInterval(focusInterval);
        document.getElementById('btn-focus').textContent = 'Weiter';
        document.getElementById('focus-status').innerHTML = '<div style="width:7px;height:7px;border-radius:50%;background:var(--yellow);"></div> Pausiert';
    }

    function resetFocus() {
        focusRunning = false;
        clearInterval(focusInterval);
        focusLeft = focusDuration;
        document.getElementById('focus-display').textContent = formatTime(focusLeft);
        document.getElementById('btn-focus').textContent = 'Session starten';
        document.getElementById('focus-status').innerHTML = '<div style="width:7px;height:7px;border-radius:50%;background:var(--purple);"></div> Bereit zum Lernen';
        document.getElementById('focus-sub').textContent = 'Wahle eine Dauer und starte deine Session';
        document.getElementById('presets').style.opacity = '1';
        document.getElementById('presets').style.pointerEvents = '';
    }

    function focusDone() {
        clearInterval(focusInterval);
        focusRunning = false;

        const mins = Math.round(focusDuration / 60);
        const now = new Date();
        const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

        sessions.push({ time: timeStr, duration: mins, subject: currentSubject });
        if (sessions.length > 8) sessions = sessions.slice(-8);
        localStorage.setItem('st_sessions', JSON.stringify(sessions));

        totalSessions++;
        totalMinutes += mins;
        localStorage.setItem('st_total_sessions', totalSessions);
        localStorage.setItem('st_total_minutes', totalMinutes);

        // Update streak
        const today = new Date().toDateString();
        const lastStudy = localStorage.getItem('st_last_study');
        if (lastStudy !== today) {
            if (lastStudy === new Date(Date.now() - 86400000).toDateString()) {
                streak++;
            } else if (!lastStudy) {
                streak = 1;
            } else {
                streak = 1;
            }
            localStorage.setItem('st_streak', streak);
            localStorage.setItem('st_last_study', today);
        }

        document.getElementById('focus-display').textContent = '00:00';
        document.getElementById('focus-status').innerHTML = '<div style="width:7px;height:7px;border-radius:50%;background:#22c55e;"></div> Session abgeschlossen!';
        document.getElementById('btn-focus').textContent = 'Neue Session';
        document.getElementById('focus-sub').textContent = mins + ' Minuten ' + currentSubject + ' abgeschlossen!';
        document.getElementById('presets').style.opacity = '1';
        document.getElementById('presets').style.pointerEvents = '';

        renderSessions();
        updateStats();

        // Notification
        if (Notification.permission === 'granted') {
            new Notification('Session abgeschlossen!', { body: mins + ' Minuten ' + currentSubject + ' gemeistert!' });
        }
    }

    function setSubject(subj, el) {
        currentSubject = subj;
        document.querySelectorAll('.subject-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        const saved = localStorage.getItem('st_notes_' + subj) || '';
        document.getElementById('notes-area').value = saved;
    }

    // Notes auto-save
    let saveTimeout;
    document.getElementById('notes-area').addEventListener('input', () => {
        clearTimeout(saveTimeout);
        document.getElementById('notes-saved').textContent = 'Speichert...';
        saveTimeout = setTimeout(() => {
            localStorage.setItem('st_notes_' + currentSubject, document.getElementById('notes-area').value);
            document.getElementById('notes-saved').textContent = 'Gespeichert';
        }, 800);
    });

    // Todos
    function addTodo() {
        const input = document.getElementById('todo-input');
        const text = input.value.trim();
        if (!text) return;
        todos.push({ id: Date.now(), text, done: false });
        localStorage.setItem('st_todos', JSON.stringify(todos));
        input.value = '';
        renderTodos();
        updateStats();
    }

    function toggleTodo(id) {
        todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
        localStorage.setItem('st_todos', JSON.stringify(todos));
        renderTodos();
        updateStats();
    }

    function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        localStorage.setItem('st_todos', JSON.stringify(todos));
        renderTodos();
        updateStats();
    }

    function renderTodos() {
        const list = document.getElementById('todo-list');
        if (todos.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:0.8rem;padding:0.75rem;">Keine Aufgaben. Fug welche hinzu!</div>';
            return;
        }
        list.innerHTML = todos.map(t => `
            <div class="todo-item">
                <div class="todo-check ${t.done ? 'checked' : ''}" onclick="toggleTodo(${t.id})">
                    ${t.done ? '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>' : ''}
                </div>
                <span class="todo-text ${t.done ? 'done' : ''}">${t.text}</span>
                <button class="btn-todo-del" onclick="deleteTodo(${t.id})">&#10005;</button>
            </div>
        `).join('');
    }

    function renderSessions() {
        const grid = document.getElementById('sessions-grid');
        if (sessions.length === 0) {
            grid.innerHTML = '<div style="grid-column:span 4;text-align:center;color:var(--muted);font-size:0.8rem;padding:1rem;">Noch keine Sessions heute</div>';
            return;
        }
        grid.innerHTML = sessions.slice(-8).map(s => `
            <div class="session-block done">
                <div class="session-block-time">${s.duration}m</div>
                <div class="session-block-label">${s.time}</div>
            </div>
        `).join('');
    }

    function updateStats() {
        document.getElementById('stat-sessions').textContent = totalSessions;
        document.getElementById('stat-hours').textContent = (totalMinutes / 60).toFixed(1);
        document.getElementById('stat-done').textContent = todos.filter(t => t.done).length;
        document.getElementById('stat-streak').textContent = streak;
        document.getElementById('streak-display').textContent = streak + ' Tage';
    }

    // Simulated online count
    function updateOnline() {
        const count = Math.floor(Math.random() * 15) + 8;
        document.getElementById('online-count').textContent = count;
    }

    // Enter key
    document.getElementById('todo-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTodo();
    });

    // Notification permission
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // Register Service Worker (PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw-study.js');
    }

    // Init
    const randomQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('quote-text').textContent = '"' + randomQuote.text + '"';
    document.getElementById('quote-author').textContent = '— ' + randomQuote.author;

    renderTodos();
    renderSessions();
    updateStats();
    setInterval(updateOnline, 15000);
</script>
</body>
</html>
