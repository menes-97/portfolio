<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#060412"/>
    </linearGradient>
    <linearGradient id="moon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Stars scattered -->
  <circle cx="80" cy="90" r="4" fill="#e0e7ff" opacity="0.7"/>
  <circle cx="140" cy="55" r="3" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="55" cy="160" r="3" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="420" cy="70" r="5" fill="#e0e7ff" opacity="0.8"/>
  <circle cx="460" cy="130" r="3" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="390" cy="45" r="2.5" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="200" cy="48" r="2.5" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="320" cy="36" r="3.5" fill="#c7d2fe" opacity="0.7"/>
  <!-- Big crescent moon -->
  <g filter="url(#glow)">
    <!-- Full circle for moon -->
    <circle cx="230" cy="220" r="148" fill="url(#moon-grad)" opacity="0.95"/>
    <!-- Cut-out circle to create crescent -->
    <circle cx="295" cy="185" r="138" fill="#0f0a2e"/>
    <!-- Crescent inner shadow -->
    <circle cx="295" cy="185" r="138" fill="#1a1245" opacity="0.3"/>
  </g>
  <!-- Mosque silhouette at bottom -->
  <g fill="#4338ca" opacity="0.7">
    <!-- Main dome -->
    <ellipse cx="256" cy="420" rx="90" ry="55" fill="#1e1b60"/>
    <path d="M166 420 Q166 350 256 345 Q346 350 346 420 Z" fill="#312e81"/>
    <!-- Left minaret -->
    <rect x="100" y="370" width="30" height="80" rx="4" fill="#1e1b60"/>
    <ellipse cx="115" cy="370" rx="15" ry="22" fill="#312e81"/>
    <line x1="115" y1="348" x2="115" y2="330" stroke="#6366f1" stroke-width="3"/>
    <!-- Right minaret -->
    <rect x="382" y="370" width="30" height="80" rx="4" fill="#1e1b60"/>
    <ellipse cx="397" cy="370" rx="15" ry="22" fill="#312e81"/>
    <line x1="397" y1="348" x2="397" y2="330" stroke="#6366f1" stroke-width="3"/>
    <!-- Crescent on dome -->
    <text x="256" y="372" text-anchor="middle" font-size="32" fill="#6366f1" opacity="0.9">&#9790;</text>
  </g>
</svg>
